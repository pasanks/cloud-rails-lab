test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# Laravel Cloud object storage, exactly as in the Cloud Ruby deploy guide.
# Private bucket: no `public: true` and no ACL options.
# BREAK 16: no guard, so a missing AWS_* variable raises KeyError at boot.
cloud:
  service: S3
  access_key_id: <%= ENV.fetch("AWS_ACCESS_KEY_ID") %>
  secret_access_key: <%= ENV.fetch("AWS_SECRET_ACCESS_KEY") %>
  region: <%= ENV.fetch("AWS_REGION", "auto") %>
  bucket: <%= ENV.fetch("AWS_BUCKET") %>
  endpoint: <%= ENV.fetch("AWS_ENDPOINT_URL") %>
  force_path_style: false
